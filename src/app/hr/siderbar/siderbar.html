<!-- <p>siderbar works!</p> -->
<div class="sidebar shadow-2xl overflow-hidden rounded-r-2xl" [class.collapsed]="isCollapsed">

  <div class="sidebar-banner relative overflow-hidden bg-gradient-to-br from-violet-600 via-purple-600 to-purple-800 px-4 pt-0 pb-4 -mx-5 -mt-5 mb-2 rounded-b-2xl">

    <div class="absolute inset-0 bg-white/5"></div>

    <svg class="absolute -bottom-6 -right-6 h-28 w-28 text-white/20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>

    <div class="relative z-10 flex flex-col items-center gap-2 pt-5 text-center">

      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white/15 text-white ring-1 ring-white/25 backdrop-blur">

        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>

      </div>

      <div class="sidebar-brand min-w-0">

        <h4 class="mb-0 text-lg font-bold leading-tight text-white">HIRENEXUX</h4>

        <small class="text-xs font-semibold uppercase tracking-wider text-purple-100">HR Panel</small>

      </div>

    </div>

  </div>

  <div class="h-px w-full bg-white/10"></div>

  <button
    type="button"
    class="sidebar-toggle hidden lg:flex w-full items-center justify-end rounded-lg px-2 py-2 text-gray-400 hover:text-white"
    (click)="toggleSidebar()"
    [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    title="Toggle sidebar"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
    </svg>
  </button>


  <nav class="sidebar-nav mt-4">

    <a
      routerLink="/hr/dashboard"
      routerLinkActive="active"
      class="nav-link transition-all duration-200 flex items-center gap-3"
      title="Dashboard"
    >
      <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10" />
      </svg>
      <span>Dashboard</span>
    </a>


    <a
      routerLink="/hr/jobs"
      routerLinkActive="active"
      class="nav-link transition-all duration-200 flex items-center gap-3"
      title="My Jobs"
    >
      <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <span>My Jobs</span>
    </a>


    <a
      routerLink="/hr/applicants"
      routerLinkActive="active"
      class="nav-link transition-all duration-200 flex items-center gap-3"
      title="Applicants"
    >
      <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span>Applicants</span>
    </a>


    <a
      routerLink="/hr/interviews"
      routerLinkActive="active"
      class="nav-link transition-all duration-200 flex items-center gap-3"
      title="Interviews"
    >
      <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Interviews</span>
    </a>

  </nav>


  <div class="sidebar-footer mt-auto border-t border-white/10 pt-4">

    <button
      type="button"
      class="w-full inline-flex items-center justify-center gap-2 rounded-lg border border-red-500/70 px-4 py-2.5 text-sm font-semibold text-red-400 transition-all duration-200 hover:bg-red-500 hover:text-white hover:shadow-lg"
      (click)="logout()"
      title="Logout"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Logout</span>
    </button>

  </div>

</div>
